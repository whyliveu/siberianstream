<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"><title>Сибирский стрим — оформление OBS</title><style>
@font-face{font-family:Manrope;src:url(../fonts/manrope-600.woff2);font-weight:600}@font-face{font-family:Manrope;src:url(../fonts/manrope-700.woff2);font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Manrope,Arial,sans-serif;color:#f7f4fa;background:#0b0910}.stage{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:radial-gradient(ellipse at 0 100%,#7830a535,transparent 55%),radial-gradient(ellipse at 100% 0,#df38842b,transparent 50%),#0b0910}.header{height:104px;padding:28px 52px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:700;letter-spacing:3px}.brand b{color:#f5e63c}.date{font-size:20px;color:#c8bcd3}.cams{position:absolute;top:112px;left:52px;right:52px;bottom:68px;display:grid;grid-template-columns:1fr 1fr;gap:26px}.cam{position:relative;border:2px solid #744684;border-radius:18px;background:#09090c;overflow:hidden}.name{position:absolute;bottom:18px;left:18px;padding:9px 20px;background:#16111eee;border-left:4px solid #efde36;border-radius:5px;font-size:23px;font-weight:600;z-index:2}.footer{position:absolute;bottom:18px;left:52px;right:52px;display:flex;justify-content:space-between;color:#b4a3c1;font-size:18px}.footer a{color:#ecb3e0;text-decoration:none}.message{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:80px;background:linear-gradient(#09070dc9,#09070de8),url(../assets/stream-v4.jpg) center/cover}.message h1{font-size:108px;font-weight:700;letter-spacing:-5px;line-height:1.08;margin:0 0 30px;max-width:1500px}.message .accent{color:#f5e63c}.message p{font-size:32px;color:#d2bedf;margin:0;line-height:1.6}.clock{font-size:64px;font-weight:700;letter-spacing:2px;margin-top:36px;font-variant-numeric:tabular-nums}.star{display:inline-block;color:#f5e63c;font-size:54px;animation:breathe 4s ease-in-out infinite;margin-bottom:30px}.message .signature{position:absolute;bottom:44px;font-size:24px;color:#bc9bce}.header,.footer{z-index:3}[hidden]{display:none!important}@keyframes breathe{50%{opacity:.6;transform:rotate(12deg) scale(.94)}}@media(prefers-reduced-motion:reduce){.star{animation:none}}
</style></head><body><main class="stage" id="stage"><header class="header"><div class="brand">СИБИРСКИЙ <b>СТРИМ</b></div><div class="date">27 ноября · 17:00 МСК</div></header><section class="cams" id="cams" aria-label="Камеры участников"></section><section class="message" id="message" hidden><span class="star" aria-hidden="true">✦</span><h1 id="headline"></h1><p id="subtitle"></p><div class="clock" id="clock" hidden></div><div class="signature">mashkasad.online</div></section><footer class="footer"><span id="topic">Ника · Саян · Антон · Маша</span><a href="https://www.donationalerts.com/r/mashkasad" target="_blank" rel="noopener noreferrer">KISS SUPPORT FOR STREAM · donationalerts.com/r/mashkasad</a></footer></main><script>
const q=new URLSearchParams(location.search),mode=q.get('scene')||'four';const stage=document.getElementById('stage'),cams=document.getElementById('cams'),message=document.getElementById('message');
function resize(){stage.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}resize();addEventListener('resize',resize);
const names=mode==='two'?['Маша','Гость']:mode==='solo'?['Гость']:['Маша','Bgirl NiKa','Саян','Антон Гладков'];
if(['four','two','solo'].includes(mode)){if(mode==='solo')cams.style.gridTemplateColumns='1fr';for(const name of names){const camera=document.createElement('div');camera.className='cam';const label=document.createElement('div');label.className='name';label.textContent=name;camera.append(label);cams.append(camera)}}else{
 cams.hidden=true;message.hidden=false;const headline=document.getElementById('headline'),subtitle=document.getElementById('subtitle');
 if(mode==='starting'){headline.innerHTML='СИБИРСКИЙ<br><span class="accent">СТРИМ</span>';subtitle.textContent='Скоро начинаем. Устраивайся поудобнее)';const clock=document.getElementById('clock');clock.hidden=false;function tick(){const t=Math.max(0,Math.ceil((Date.parse('2026-11-27T17:00:00+03:00')-Date.now())/1000));clock.textContent=t?Math.floor(t/86400)+' д · '+String(Math.floor(t%86400/3600)).padStart(2,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'):'Сейчас начнём';}tick();setInterval(tick,1000)}
 else if(mode==='break'){headline.innerHTML='МАЛЕНЬКИЙ<br><span class="accent">ПЕРЕРЫВ</span>';subtitle.textContent='Скоро вернёмся)'}
 else{headline.innerHTML='СПАСИБО,<br><span class="accent">ЧТО БЫЛИ С НАМИ</span>';subtitle.textContent='До следующего разговора)'}
}
</script></body></html>
